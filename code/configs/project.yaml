data:
  spatial_extent:
    longmin: -9.4900
    longmax: -6.0234
    latmin: 36.812
    latmax: 42.2724
  crs: "EPSG:3763"
  scale: 1000 # meters

  temporal_extent:
    start_date: "2025-01-01"
    end_date: "2025-12-31"
    day_interval: 1

model: 
  num_modules: 2
  embedding_dim: 256
  patch_size: 16 # Pixels

training:
  learning_rate: 0.0001
  num_epochs: 20
  loss_function : "weighted_bce" # "mse"
  batch_size: 4

data_paths:
  raw:
    MODIS: 'data/raw/LST_MODIS_8day'
    DTM: 'data/processed/slope'
    target: 'data/processed/burn'
  processed:

data_sets:
  path: "data/datasets"